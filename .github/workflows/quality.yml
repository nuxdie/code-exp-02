name: Quality
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install C++ tooling and rendering dependencies
        run: |
          printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu/' 'https://mirrors.mit.edu/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          echo 'Acquire::Retries "2"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80ci-network > /dev/null
          sudo apt-get update --error-on=any
          sudo apt-get install -y cmake cmake-format g++ pkg-config python3 python3-websockets clang-format-18 clang-tidy-18 clangd-18 libx11-dev libpango1.0-dev libfontconfig1-dev librsvg2-dev libepoxy-dev nlohmann-json3-dev graphviz texlive-latex-base dvisvgm xvfb xauth libgl1-mesa-dri libglx-mesa0
      - name: Install the pinned CMake language server
        run: python3 tools/install_cmake_lsp.py
      - name: Run the quality gate, including GPU tests with Mesa
        run: xvfb-run -a python3 tools/quality.py --build --jobs 2
