<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Source Canvas</title>
  <desc id="desc">Code, conversations, and intent in one workspace. A dark banner with connected source cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151b25"/><stop offset="1" stop-color="#0c1017"/>
    </linearGradient>
    <linearGradient id="accent" x1="65" y1="290" x2="600" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#81d8d0"/><stop offset="1" stop-color="#81d8d0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#6a829e" opacity=".13"/>
    </pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="m0 0 6 3-6 3" fill="#81d8d0"/>
    </marker>
  </defs>
  <rect width="1280" height="350" rx="18" fill="url(#bg)"/>
  <rect x="650" y="1" width="629" height="348" rx="18" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1279" height="349" rx="17.5" stroke="#2a3442"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="64" y="56" width="6" height="6" rx="3" fill="#81d8d0"/>
    <text x="83" y="64" fill="#81d8d0" font-size="12" font-weight="600" letter-spacing="3">A NATIVE CODE WORKSPACE</text>
    <text x="60" y="160" fill="#edf3fa" font-size="70" font-weight="700" letter-spacing="-3">Source Canvas</text>
    <text x="64" y="210" fill="#afbdce" font-size="23">See the code. Keep the context.</text>
    <text x="64" y="257" fill="#7e90a7" font-size="15" letter-spacing=".4">CODE  /  CONVERSATIONS  /  HUMAN INTENT</text>
    <path d="M64 290h535" stroke="url(#accent)" stroke-width="2"/>
  </g>
  <g stroke="#81d8d0" stroke-opacity=".5" stroke-width="1.5">
    <path d="M913 111C984 111 963 185 1012 185" marker-end="url(#arrow)"/>
    <path d="M782 161C782 208 839 209 839 247" marker-end="url(#arrow)"/>
    <path d="M1013 236C971 236 981 280 941 280" marker-end="url(#arrow)"/>
  </g>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="11">
    <rect x="710" y="63" width="204" height="109" rx="9" fill="#1b2330" stroke="#37465a"/>
    <path d="M710 94h204" stroke="#37465a"/>
    <circle cx="727" cy="79" r="3" fill="#81d8d0"/>
    <text x="740" y="83" fill="#d3dfed">main.cpp</text>
    <text x="727" y="116" fill="#bca4ec">int <tspan fill="#f0ca90">main</tspan><tspan fill="#aabbd0">() {</tspan></text>
    <text x="741" y="137" fill="#aabbd0">Application canvas;</text>
    <text x="741" y="158" fill="#81d8d0">canvas.run();</text>
    <rect x="1015" y="140" width="201" height="107" rx="9" fill="#1b2330" stroke="#37465a"/>
    <path d="M1015 171h201" stroke="#37465a"/>
    <circle cx="1032" cy="156" r="3" fill="#f0ca90"/>
    <text x="1045" y="160" fill="#d3dfed">camera.h</text>
    <text x="1032" y="193" fill="#bca4ec">struct <tspan fill="#f0ca90">Camera</tspan><tspan fill="#aabbd0"> {</tspan></text>
    <text x="1046" y="214" fill="#aabbd0">Vec2 center;</text>
    <text x="1046" y="235" fill="#81d8d0">double zoom = 1;</text>
    <rect x="753" y="249" width="190" height="60" rx="9" fill="#1b2330" stroke="#37465a"/>
    <text x="771" y="274" fill="#81d8d0">↳ Human intent</text>
    <text x="771" y="294" fill="#aabbd0">Keep the bigger picture.</text>
  </g>
</svg>
